name = "jant" # @create-jant: "${name}"
main = "index.js"
compatibility_date = "2026-01-20"
compatibility_flags = ["nodejs_compat"]
# Keep the variables you set in the Cloudflare dashboard when you deploy.
# Without this, every deploy deletes the ones this file doesn't list. A
# variable listed here wins over the dashboard, and removing one from this
# file leaves it on the Worker until you delete it in the dashboard.
keep_vars = true
account_id = "1fa95d28c712735240b0bb2f0004c085" # @create-jant: @remove

[assets]
directory = "./node_modules/@jant/core/dist/client"

# @create-jant: @remove-start
[dev]
port = 3000
# @create-jant: @remove-end

# ============================================
# Environment Variables
# ============================================
# Non-sensitive configuration goes here in [vars]
# Sensitive secrets (like AUTH_SECRET and INTERNAL_ADMIN_TOKEN) should be:
# - Local dev: .dev.vars file (not committed)
# - Production: wrangler secret put AUTH_SECRET
# Full details: https://jant.me/docs/configuration

[vars]
# Optional: Pin your site's public origin (e.g. https://my-blog.example.com)
# https://jant.me/docs/configuration#public-url-and-subpath
SITE_ORIGIN = "https://jant.xixihaha.tech" # @create-jant: @remove
# Optional: Mount the site under a subpath such as /blog
# SITE_PATH_PREFIX = "/blog"

# Optional: Site configuration
# You can also set these from the Settings page at /settings
# https://jant.me/docs/configuration#settings-page-options
# SITE_NAME = "My Blog"
# SITE_DESCRIPTION = "A personal blog powered by Jant"
# SITE_LANGUAGE = "en"

# Optional: Pagination defaults
# PAGE_SIZE = 25
# SEARCH_PAGE_SIZE = 25
# ARCHIVE_PAGE_SIZE = 100

# Optional: R2 Storage (for media uploads)
# https://jant.me/docs/configuration#r2-default
# R2_PUBLIC_URL = "https://cdn.example.com"
R2_PUBLIC_URL = "https://jant-media.xixihaha.tech"

# Optional: Cloudflare Image Transformations
# For automatic thumbnail generation and image optimization
# https://jant.me/docs/configuration#image-transformations-optional
# IMAGE_TRANSFORM_URL = "https://example.com/cdn-cgi/image"


[[d1_databases]]
binding = "DB"
database_name = "jant-db" # @create-jant: "${name}-db"
database_id = "45127a41-b2a2-4bc7-8c81-0b8d500cbacf" # @create-jant: "local"
migrations_dir = "node_modules/@jant/core/src/db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "jant-media" # @create-jant: "${name}-media"

# Optional: S3-compatible storage (alternative to R2)
# Set STORAGE_DRIVER = "s3" and configure the options below.
# When using S3, the [[r2_buckets]] section can be removed.
# https://jant.me/docs/configuration#s3-compatible-storage
# STORAGE_DRIVER = "s3"
# S3_ENDPOINT = "https://s3.example.com"
# S3_BUCKET = "my-bucket"
# S3_REGION = "us-east-1"
# S3_PUBLIC_URL = "https://cdn.example.com"
